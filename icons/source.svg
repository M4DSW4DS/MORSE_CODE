<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фон -->
  <rect width="512" height="512" fill="#0a0c10"/>

  <!-- Паттерн PCB-точек -->
  <pattern id="pcb" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="2" fill="#1c2228"/>
  </pattern>
  <rect width="512" height="512" fill="url(#pcb)"/>

  <!-- Золотая круглая рамка -->
  <circle cx="256" cy="256" r="184"
          fill="none" stroke="#c9a227" stroke-width="12"/>

  <!-- Морзе "· – ·" (буква R) -->
  <circle cx="146" cy="256" r="32" fill="#f0c94a"/>
  <rect   x="196" y="224" width="120" height="64" rx="32" fill="#f0c94a"/>
  <circle cx="366" cy="256" r="32" fill="#f0c94a"/>
</svg>