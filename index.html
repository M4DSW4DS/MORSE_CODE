<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MORSE CODE Gadget</title>
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Interactive Morse code trainer and transmitter">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="./icons/favicon-96x96.png">
<link rel="icon" type="image/x-icon" href="./icons/favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morse">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0a0c10;--board-bg:#12161a;--gold:#c9a227;--gold-bright:#f0c94a;--gold-dim:#5c4711;--green:#39ff88;--red:#ff3333;--text:#fff;--control-width:clamp(40px,7vw,60px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;height:100dvh;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.app-container{display:flex;flex-direction:column;width:100vw;height:100dvh}
header{width:100%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;z-index:10;background:var(--bg)}
#morse-display{font-size:.85rem;color:var(--gold);letter-spacing:2px;font-family:monospace;font-weight:bold;min-height:1.3em;text-align:center;text-shadow:0 0 10px rgba(201,162,39,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;max-width:100%;font-variant-numeric:tabular-nums}
#decoded{font-size:2rem;color:var(--green);min-height:1.4em;text-align:center;letter-spacing:2px;font-weight:bold;text-shadow:0 0 15px rgba(57,255,136,.4);font-family:monospace;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;overflow:hidden;white-space:nowrap;padding:0 10px}
#final-text{color:#fff;text-shadow:none;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
#final-text span{transition:color .1s,text-shadow .1s,transform .15s;display:inline-block}
#final-text span.playing{color:var(--gold-bright);text-shadow:0 0 12px var(--gold-bright);font-weight:900;transform:scale(1.15)}
#current-char{color:var(--gold);text-shadow:0 0 10px rgba(201,162,39,.5);flex:0 0 auto}
@keyframes indPulse{0%,100%{opacity:.65}50%{opacity:1}}
.main-content{display:flex;flex:1;flex-direction:row;width:100%;overflow:hidden;position:relative}
.spacer-left{flex:0 0 var(--control-width)}
.controls-right{flex:0 0 var(--control-width);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:10px 0;z-index:10}
.board-container{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;min-width:0}
#board-svg{width:100%;height:100%;max-width:100%;display:block}
#settings-btn{position:absolute;top:10px;right:10px;z-index:50;width:40px;height:40px;cursor:pointer;fill:#7a828c;transition:fill .2s,transform .2s}
#settings-btn:hover{fill:var(--gold);transform:rotate(45deg)}
#ind-torch{position:absolute;top:10px;left:10px;z-index:50;width:40px;height:40px;display:none;align-items:center;justify-content:center;font-size:26px;line-height:1;pointer-events:none}
#ind-torch.on{display:flex;filter:drop-shadow(0 0 10px var(--gold-bright));animation:indPulse 1.2s ease-in-out infinite}
.side-btn{width:clamp(35px,7vw,50px);height:clamp(35px,7vw,50px);border-radius:50%;background:linear-gradient(to bottom,#2a3038,#1a1e24);color:var(--gold);border:2px solid #4a5058;border-bottom:5px solid #0a0c10;font-family:'Courier New',monospace;font-size:.6rem;font-weight:bold;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .05s,border-bottom .05s;box-shadow:0 5px 10px rgba(0,0,0,.5);padding:5px;touch-action:manipulation}
.side-btn:active{transform:translateY(3px);border-bottom:2px solid #0a0c10}
.main-key-btn{width:clamp(55px,11vw,80px);height:clamp(55px,11vw,80px);border-radius:50%;background:radial-gradient(circle at 35% 35%,#4a5058,#1a1e24);border:3px solid #5a6068;border-bottom:8px solid #0a0c10;box-shadow:0 10px 25px rgba(0,0,0,.8),inset 0 2px 5px rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .05s,border-bottom .05s;position:relative;touch-action:manipulation}
.main-key-btn::after{content:'';width:40%;height:40%;border-radius:50%;background:#2a3038;box-shadow:inset 0 3px 6px rgba(0,0,0,.8);transition:background .1s,box-shadow .1s}
.dash-key{display:none;order:1}
.dash-key::after{width:60% !important;height:20% !important;border-radius:3px !important}
.two-keys .dash-key{display:flex}
.two-keys #morse-key{order:-1}
.main-key-btn.active{transform:translateY(5px);border-bottom:3px solid #0a0c10;background:radial-gradient(circle at 35% 35%,#5a6068,#2a3038)}
.main-key-btn.active::after{background:var(--gold-bright);box-shadow:0 0 25px var(--gold-bright)}
.main-key-btn.blink-green::after{background:var(--green);box-shadow:0 0 25px var(--green)}
.main-key-btn.blink-red::after{background:var(--red);box-shadow:0 0 25px var(--red)}
.modal{position:fixed;inset:0;width:100vw;height:100dvh;background:linear-gradient(to bottom,#14181d,#0a0c10);transform:translateY(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:1000;display:flex;flex-direction:column;padding:30px 20px;overflow-y:auto}
.modal.open{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;max-width:500px;width:100%;margin-left:auto;margin-right:auto;gap:10px}
.modal-header h2{margin:0;color:var(--gold);font-size:1.5rem;letter-spacing:2px;flex:1}
.lang-toggle{display:flex;gap:2px;align-items:center;font-family:'Courier New',monospace;font-size:.75rem;padding:0 6px;border:1px solid #2a3038;border-radius:6px;background:#0e1216;cursor:pointer;height:32px}
.lang-toggle span{padding:3px 6px;color:#4a5058;transition:color .15s;font-weight:bold}
.lang-toggle span.active{color:var(--gold-bright)}
.close-modal{background:none;border:none;color:var(--text);font-size:2rem;cursor:pointer;padding:0;line-height:1}
button.tool-btn{background:linear-gradient(to bottom,#2a3038,#1a1e24);color:var(--gold);border:1px solid #3a4048;border-bottom:4px solid #0a0c10;border-radius:12px;padding:15px;font-family:inherit;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:transform .05s}
button.tool-btn:active{transform:translateY(2px);border-bottom:2px solid #0a0c10}
button.tool-btn-gold{background:linear-gradient(to bottom,var(--gold-bright),var(--gold));color:#0a0c10;border:1px solid #8a6e1a;border-bottom:4px solid #4a3810}
button.tool-btn-gold:active{border-bottom:2px solid #4a3810}
#install-btn{display:none;width:100%}
#install-btn.visible{display:block}
.full-btn{width:100%;max-width:500px;margin:20px auto 0;display:block}

.tech-section{font-family:'Courier New',monospace;border:1px solid #1a1e24;border-radius:10px;padding:14px 16px;background:linear-gradient(to bottom,#0e1216,#0a0c10);max-width:500px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.tech-row{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed #1a1e24}
.tech-row:last-child{border-bottom:none;padding-bottom:2px}
.tech-row:first-child{padding-top:2px}
.tech-key{color:var(--gold);font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:bold}
.tech-value{color:var(--green);font-size:1.05rem;font-weight:bold;text-align:right;min-width:52px;font-variant-numeric:tabular-nums}
.tech-unit{color:#7a828c;font-size:.65rem;letter-spacing:1px;min-width:22px;text-align:left}
.tech-row input[type=range]{width:100%;accent-color:var(--green);height:24px}
.tech-btn{background:linear-gradient(to bottom,#1a1e24,#0a0c10);border:1px solid #2a3038;border-radius:6px;padding:6px 12px;color:var(--gold-bright);font-family:'Courier New',monospace;font-size:.95rem;font-weight:bold;cursor:pointer;transition:all .1s;font-variant-numeric:tabular-nums;min-width:80px;justify-self:end}
.tech-btn:hover{border-color:var(--gold-dim)}
.tech-btn:active{transform:translateY(1px)}

.toggle-btn{background:linear-gradient(to bottom,#1a1e24,#0a0c10);border:1px solid #2a3038;border-radius:20px;padding:7px 14px;color:#7a828c;font-family:'Courier New',monospace;font-size:.72rem;letter-spacing:1.5px;font-weight:bold;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px;min-width:110px;justify-content:flex-start}
.toggle-btn .dot-ind{width:8px;height:8px;border-radius:50%;background:#3a4048;transition:all .15s;flex:0 0 auto}
.toggle-btn .state-txt{margin-left:auto;font-size:.68rem}
.toggle-btn.on{color:var(--gold-bright);border-color:var(--gold-dim)}
.toggle-btn.on .dot-ind{background:var(--green);box-shadow:0 0 8px var(--green)}
.toggle-btn:disabled{opacity:.35;cursor:not-allowed}
#status{font-size:.82rem;color:#7a828c;margin:24px auto 10px;text-align:center;max-width:500px;line-height:1.7}
#status b{color:var(--gold)}
#status-msg{text-align:center;margin:10px auto 0;min-height:1.2em;font-size:.8rem;color:var(--gold-bright);opacity:0;transition:opacity .2s;max-width:500px}
#status-msg.show{opacity:1}
#version-info{text-align:center;margin:24px auto 4px;font-size:.7rem;color:#4a5058;letter-spacing:1.2px;line-height:1.5;font-family:'Courier New',monospace}

.pcb-bg{fill:var(--board-bg)}
.pcb-dots{fill:#1c2228}
.pcb-trace{fill:none;stroke:var(--gold-dim);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,stroke-width .15s}
.pcb-trace.active{stroke:var(--gold-bright);stroke-width:5;filter:drop-shadow(0 0 6px var(--gold-bright))}
.pad-shape{fill:var(--board-bg);stroke:var(--gold);stroke-width:3;transition:all .15s}
.pad-shape.rect-shape.active{fill:var(--red);stroke:#fff;filter:drop-shadow(0 0 10px var(--red))}
.pad-shape.circle-shape.active{fill:var(--green);stroke:#fff;filter:drop-shadow(0 0 10px var(--green))}
.antenna{stroke:#7a828c;fill:none;stroke-width:4;pointer-events:none;transition:stroke .15s,filter .15s}
.antenna.active{stroke:#fff;filter:drop-shadow(0 0 8px #fff)}
@keyframes antFlicker{0%,100%{stroke:#7a828c;filter:none}50%{stroke:#fff;filter:drop-shadow(0 0 12px rgba(255,255,255,.8))}}
.antenna.inputting{animation:antFlicker .8s ease-in-out infinite}
.antenna-hit{fill:transparent;pointer-events:all;cursor:pointer;touch-action:none}
.pad-text{fill:var(--text);font-family:Arial,sans-serif;font-size:20px;font-weight:900;text-anchor:middle;dominant-baseline:middle;pointer-events:none;stroke:var(--bg);stroke-width:5px;paint-order:stroke fill}
.board-title{fill:#7a828c;font-family:sans-serif;font-size:24px;font-weight:bold;letter-spacing:4px;opacity:.8}
#ios-hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:900;background:rgba(20,24,29,.95);color:var(--text);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;font-size:.8rem;max-width:320px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.8);display:none}
#ios-hint.visible{display:block}
#ios-hint b{color:var(--gold-bright)}
#ios-hint .close-hint{position:absolute;top:4px;right:8px;cursor:pointer;color:#7a828c;font-weight:bold;font-size:1rem}

@media (orientation: landscape) { #bg-portrait { display: none; } }
@media (orientation: landscape) and (max-width: 1000px) { .spacer-left { display: none; } }
@media (orientation: portrait) {
  #bg-landscape { display: none; }
  #morse-display { font-size: .75rem; letter-spacing: 1.5px; }
  #decoded { font-size: 1.7rem; }
  .main-content { flex-direction: column; }
  .spacer-left { display: none; }
  .controls-right { flex: 0 0 auto; flex-direction: row; width: 100%; justify-content: center; gap: 20px; padding: 16px 0 24px; border-top: 1px solid #1a1e24; background: var(--bg); }
  .board-container { width: 100%; }
  .pad-text { font-size: 36px; stroke-width: 7px; }
  .board-title { font-size: 36px; letter-spacing: 6px; }
  .side-btn { width: clamp(55px,14vw,75px); height: clamp(55px,14vw,75px); font-size: .8rem; }
  .main-key-btn { width: clamp(85px,22vw,115px); height: clamp(85px,22vw,115px); }
  .antenna { stroke-width: 6; }
  .two-keys { gap: 10px; }
  .two-keys .main-key-btn { width: clamp(70px,18vw,95px); height: clamp(70px,18vw,95px); }
  .two-keys .side-btn { width: clamp(45px,12vw,60px); height: clamp(45px,12vw,60px); font-size: .65rem; }
}
@media (orientation: landscape) and (min-width: 1001px) {
  .two-keys { gap: 12px; }
  .two-keys .main-key-btn { width: clamp(50px,9vw,70px); height: clamp(50px,9vw,70px); }
}
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div id="morse-display" aria-live="polite" aria-atomic="true"></div>
    <div id="decoded" aria-live="polite" aria-atomic="true">
      <span id="final-text"></span>
      <span id="current-char"></span>
    </div>
  </header>

  <div class="main-content">
    <div class="spacer-left"></div>
    <div class="board-container">
      <svg id="settings-btn" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      <div id="ind-torch">🔦</div>

      <svg id="board-svg" viewBox="30 20 1020 440" preserveAspectRatio="xMidYMid meet">
        <g id="bg-landscape">
          <rect x="30" y="20" width="1020" height="440" class="pcb-bg"/>
          <pattern id="pcb-dots-L" x="30" y="20" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" class="pcb-dots"/></pattern>
          <rect x="30" y="20" width="1020" height="440" fill="url(#pcb-dots-L)"/>
          <text x="110" y="60" class="board-title">MORSE</text>
          <text x="840" y="60" class="board-title">CODE</text>
          <rect class="antenna-hit" x="450" y="15" width="140" height="110"/>
          <path class="antenna" d="M 520 30 L 520 85 M 485 85 L 555 85 M 500 100 L 540 100 L 520 85 Z"/>
        </g>
        <g id="bg-portrait">
          <rect x="60" y="70" width="1000" height="1000" rx="30" class="pcb-bg"/>
          <pattern id="pcb-dots-P" x="60" y="70" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" class="pcb-dots"/></pattern>
          <rect x="60" y="70" width="1000" height="1000" rx="30" fill="url(#pcb-dots-P)"/>
          <rect x="60" y="70" width="1000" height="1000" rx="30" fill="none" stroke="#3a2e12" stroke-width="8"/>
          <text x="250" y="120" class="board-title">MORSE</text>
          <text x="730" y="120" class="board-title">CODE</text>
          <rect class="antenna-hit" x="430" y="55" width="160" height="170"/>
          <path class="antenna" d="M510 75V125M465 125H555M480 148H540L510 125Z"/>
          <g opacity=".6">
            <circle cx="510" cy="950" r="12" fill="none" stroke="#7a828c" stroke-width="4"/>
            <path d="M485 925a35 35 0 0 0 0 50M470 910a50 50 0 0 0 0 80M535 925a35 35 0 0 1 0 50M550 910a50 50 0 0 1 0 80" fill="none" stroke="#7a828c" stroke-width="4" stroke-linecap="round"/>
          </g>
        </g>
        <g id="traces-group"></g>
        <g id="components-group"></g>
      </svg>
    </div>
    <div class="controls-right" id="controls-right">
      <button id="btn-space" class="side-btn">SPACE</button>
      <button id="morse-key" class="main-key-btn" aria-label="Morse Key"></button>
      <button id="dash-key" class="main-key-btn dash-key" aria-label="Dash Key"></button>
      <button id="btn-reset" class="side-btn">RESET</button>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal">
  <div class="modal-header">
    <h2>SETTINGS</h2>
    <button id="lang-toggle" class="lang-toggle" aria-label="Toggle language">
      <span data-lang="en">EN</span><span data-lang="ru">RU</span>
    </button>
    <button class="close-modal" id="close-modal">✕</button>
  </div>

  <div class="tech-section">
    <div class="tech-row">
      <span class="tech-key">Tone</span>
      <input type="range" id="tone" min="400" max="1000" value="700" step="50">
      <span><span class="tech-value" id="tone-val">700</span> <span class="tech-unit">Hz</span></span>
    </div>
    <div class="tech-row">
      <span class="tech-key">Volume</span>
      <input type="range" id="vol" min="0" max="100" value="50" step="5">
      <span><span class="tech-value" id="vol-val">50</span> <span class="tech-unit">%</span></span>
    </div>
    <div class="tech-row">
      <span class="tech-key">Dot</span>
      <button class="tech-btn" id="dot-btn"><span id="dot-val">200</span> ms</button>
    </div>
  </div>

  <div class="tech-section" style="margin-top:16px">
    <div class="tech-row">
      <span class="tech-key">Vibro</span>
      <div style="grid-column:span 2;display:flex;justify-content:flex-end">
        <button class="toggle-btn" id="vibro-toggle"><span class="dot-ind"></span>VIBRO<span class="state-txt">OFF</span></button>
      </div>
    </div>
    <div class="tech-row" id="torch-row">
      <span class="tech-key">Torch</span>
      <div style="grid-column:span 2;display:flex;justify-content:flex-end">
        <button class="toggle-btn" id="torch-toggle"><span class="dot-ind"></span>TORCH<span class="state-txt">OFF</span></button>
      </div>
    </div>
    <div class="tech-row">
      <span class="tech-key">Keys</span>
      <div style="grid-column:span 2;display:flex;justify-content:flex-end">
        <button class="toggle-btn" id="twokeys-toggle"><span class="dot-ind"></span>TWO KEYS<span class="state-txt">OFF</span></button>
      </div>
    </div>
  </div>

  <button class="tool-btn tool-btn-gold full-btn" id="install-btn" title="Install App">⬇ Install App</button>

  <div id="status-msg"></div>
  <div id="status"></div>
  <div id="version-info">Version 1.0<br>M4DSW4DS</div>
</div>

<div id="ios-hint"><span class="close-hint" id="close-ios-hint">✕</span><span id="ios-hint-text"></span></div>

<script>
const storage=(()=>{
  try{const t='_t'+Math.random();localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}
  catch{const d={};return{getItem:k=>k in d?d[k]:null,setItem:(k,v)=>{d[k]=String(v);},removeItem:k=>{delete d[k];}};}
})();

const I18N={
  en:{
    status:'<b>KEY</b>: short tap — DOT, long hold — DASH<br>📡 <b>WIRE</b>: 1 tap — replay, tap again — stop<br>📡 3 taps in a row — continuous repeat<br><b>RESET</b>: tap — erase symbol, hold — erase all<br><b>SPACE</b>: space / finish letter',
    installBtn:'⬇ Install App',
    iosHint:'Install App: tap <b>Share</b> → <b>Add to Home Screen</b>',
    torchUnavail:'Torch unavailable on this device'
  },
  ru:{

let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}

const Player={
  _osc:null,_gain:null,_keyVibroTimer:null,

  startContinuous(){
    initAudio();
    this._osc=audioCtx.createOscillator();
    this._gain=audioCtx.createGain();
    this._osc.type='sine';
    this._osc.frequency.value=SETTINGS.tone;
    this._gain.gain.value=SETTINGS.volume;
    this._osc.connect(this._gain);
    this._gain.connect(audioCtx.destination);
    this._osc.start();
    morseKey.classList.remove('blink-green');
    morseKey.classList.add('blink-red');
    this._startKeyVibro();
    torchOnHold();
  },

  stopContinuous(){
    if(this._osc){
      try{this._osc.stop();}catch{}
      try{this._osc.disconnect();}catch{}
      try{this._gain.disconnect();}catch{}
      this._osc=null;this._gain=null;
    }
    morseKey.classList.remove('blink-red','blink-green');
    this._stopKeyVibro();
    torchOffHold();
  },

  playTone(ms,type='dot',target=null){
    initAudio();
    const btn=target||morseKey;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sine';
    o.frequency.value=SETTINGS.tone;
    g.gain.value=SETTINGS.volume;
    o.connect(g);g.connect(audioCtx.destination);
    btn.classList.remove('blink-green','blink-red');
    btn.classList.add(type==='dot'?'blink-green':'blink-red');
    triggerFlash(ms);
    o.start();
    setTimeout(()=>{
      try{o.stop();}catch{}
      try{g.disconnect();}catch{}
      btn.classList.remove('blink-green','blink-red');
    },ms);
  },

  vibrate(pattern){if(SETTINGS.vibro) navigator.vibrate?.(pattern);},

  _startKeyVibro(){
    if(!SETTINGS.vibro||!navigator.vibrate) return;
    this._stopKeyVibro();
    navigator.vibrate(100);
    this._keyVibroTimer=setInterval(()=>navigator.vibrate(100),200);
  },

  _stopKeyVibro(){
    if(this._keyVibroTimer){clearInterval(this._keyVibroTimer);this._keyVibroTimer=null;}
    if(navigator.vibrate) navigator.vibrate(0);
  },

  stop(){this.stopContinuous();STATE.abortPlayback=true;}
};

const vibrate=p=>Player.vibrate(p);
const stopKeyVibrate=()=>Player._stopKeyVibro();

let stateLoaded=false;
function scheduleSaveState(){
  if(!stateLoaded) return;
  if(STATE.saveTimer) return;
  STATE.saveTimer=setTimeout(()=>{STATE.saveTimer=null;saveState();},500);
}
function flushSaveState(){
  if(STATE.saveTimer){clearTimeout(STATE.saveTimer);STATE.saveTimer=null;}
  saveState();
}
function saveState(){
  if(!stateLoaded) return;
  try{storage.setItem(STORAGE_KEYS.state,JSON.stringify({finalText:STATE.finalText,finalMorseText:STATE.finalMorseText,ts:Date.now()}));}catch{}
}
function loadState(){
  try{
    const raw=storage.getItem(STORAGE_KEYS.state);if(!raw)return;
    const s=JSON.parse(raw);
    if(Date.now()-(s.ts||0)>STATE_TTL){storage.removeItem(STORAGE_KEYS.state);return;}
    STATE.finalText=s.finalText||'';
    STATE.finalMorseText=s.finalMorseText||'';
  }catch{}
}
function saveSettings(){

}
function loadSettings(){

    const s=JSON.parse(storage.getItem(STORAGE_KEYS.settings)||'{}');
    if(typeof s.tone==='number') SETTINGS.tone=s.tone;
    if(typeof s.vol==='number') SETTINGS.volume=s.vol;
    if(typeof s.dot==='number'&&DOT_VALUES.includes(s.dot)) SETTINGS.dotThreshold=s.dot;

}

function setTorch(on){STATE.torchTarget=on;applyTorchLoop();}
async function applyTorchLoop(){
  if(STATE.torchBusy||!STATE.torchTrack) return;
  STATE.torchBusy=true;
  try{
    while(STATE.torchTrack&&STATE.torchTarget!==STATE.torchState){
      const want=STATE.torchTarget;
      try{
        await Promise.race([
          STATE.torchTrack.applyConstraints({advanced:[{torch:want}]}),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),500))
        ]);
        STATE.torchState=want;
      }catch{
        STATE.torchTarget=STATE.torchState;
        setTimeout(()=>{
          SETTINGS.torch=false;
          storage.setItem(STORAGE_KEYS.torch,'0');
          const btn=$('torch-toggle');
          if(btn){btn.classList.remove('on');const st=btn.querySelector('.state-txt');if(st)st.textContent='OFF';}
          $('ind-torch').classList.remove('on');
          setStatus(I18N[currentLang].torchUnavail);
        },0);
        break;
      }
    }
  }finally{STATE.torchBusy=false;}
}
async function ensureTorch(){
  if(STATE.torchTrack) return true;
  if(STATE.torchIniting) return false;
  if(!navigator.mediaDevices?.getUserMedia) return false;
  STATE.torchIniting=true;
  try{
    const s=await Promise.race([
      navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))
    ]);
    const t=s.getVideoTracks()[0];
    const caps=t.getCapabilities?t.getCapabilities():{};
    if(!caps.torch){s.getTracks().forEach(x=>x.stop());return false;}
    STATE.torchStream=s;STATE.torchTrack=t;
    STATE.torchTarget=false;STATE.torchState=false;
    return true;
  }catch{return false;}
  finally{STATE.torchIniting=false;}
}
function releaseTorch(){
  if(STATE.torchStream){STATE.torchStream.getTracks().forEach(t=>t.stop());STATE.torchStream=null;}
  STATE.torchTrack=null;STATE.torchTarget=false;STATE.torchState=false;
  if(STATE.torchFlashTimer){clearTimeout(STATE.torchFlashTimer);STATE.torchFlashTimer=null;}
  STATE.torchFlashUntil=0;
}
function triggerFlash(ms){
  if(!SETTINGS.torch) return;
  if(!STATE.torchTrack){ensureTorch().then(ok=>{if(ok) triggerFlash(ms);});return;}
  const now=performance.now();
  const newUntil=now+Math.max(ms,60);
  if(newUntil<=STATE.torchFlashUntil) return;
  STATE.torchFlashUntil=newUntil;
  if(STATE.torchFlashTimer) clearTimeout(STATE.torchFlashTimer);
  setTorch(true);
  STATE.torchFlashTimer=setTimeout(()=>{
    setTorch(false);
    STATE.torchFlashTimer=null;
    STATE.torchFlashUntil=0;
  },STATE.torchFlashUntil-now);
}
function torchOnHold(){
  if(!SETTINGS.torch) return;
  if(!STATE.torchTrack){ensureTorch().then(ok=>{if(ok)torchOnHold();});return;}
  if(STATE.torchFlashTimer){clearTimeout(STATE.torchFlashTimer);STATE.torchFlashTimer=null;}
  STATE.torchFlashUntil=0;
  setTorch(true);
}
function torchOffHold(){
  if(!SETTINGS.torch) return;
  if(STATE.torchFlashTimer){clearTimeout(STATE.torchFlashTimer);STATE.torchFlashTimer=null;}
  STATE.torchFlashUntil=0;
  setTorch(false);
}

const resetLights=()=>document.querySelectorAll('.pad-shape.active, .pcb-trace.active').forEach(el=>el.classList.remove('active'));
function highlightPath(char){
  let cur=char;
  while(cur&&cur!=='root'){
    const n=NODES[cur];if(!n?.parent)break;
    $(`node-${cur}`)?.classList.add('active');
    $(`trace-${n.parent}-${cur}`)?.classList.add('active');
    cur=n.parent;
  }
}
function setAntennaInputting(on){
  document.querySelectorAll('.antenna').forEach(el=>el.classList.toggle('inputting',on));
}

let _spanCache=[];
let _cachedText='__INIT__';
let _lastPlayingIdx=-1;
function renderFinalText(playingIdx){
  if(STATE.finalText!==_cachedText){
    _cachedText=STATE.finalText;
    finalTextEl.innerHTML='';
    _spanCache=[];
    for(let i=0;i<STATE.finalText.length;i++){
      const span=document.createElement('span');
      span.textContent=STATE.finalText[i]===' '?'\u00A0':STATE.finalText[i];
      finalTextEl.appendChild(span);
      _spanCache.push(span);
    }
    if(STATE.finalText) finalTextEl.appendChild(document.createTextNode(' '));
    _lastPlayingIdx=-1;
  }
  if(_lastPlayingIdx>=0&&_spanCache[_lastPlayingIdx]) _spanCache[_lastPlayingIdx].classList.remove('playing');
  if(playingIdx>=0&&_spanCache[playingIdx]) _spanCache[playingIdx].classList.add('playing');
  _lastPlayingIdx=playingIdx;
}

function updateBoard(){
  resetLights();
  renderFinalText(-1);
  setAntennaInputting(!!STATE.inputPath);
  if(!STATE.inputPath){
    currentCharEl.textContent='';
    morseDisplayEl.textContent=STATE.finalMorseText.trim();
    scheduleSaveState();
    return;
  }
  morseDisplayEl.textContent=(STATE.finalMorseText+' '+STATE.inputPath.split('').join(' ')).trim();
  const char=Object.keys(MORSE_MAP).find(k=>MORSE_MAP[k]===STATE.inputPath);
  currentCharEl.textContent=char||'?';
  if(char) highlightPath(char);
  scheduleSaveState();
}
function finalizeLetter(){
  if(!STATE.inputPath) return;
  clearTimeout(STATE.inputTimer);
  currentCharEl.classList.remove('finalizing');
  const char=Object.keys(MORSE_MAP).find(k=>MORSE_MAP[k]===STATE.inputPath);
  STATE.finalText+=char||'?';
  STATE.finalMorseText+=STATE.inputPath+' ';
  STATE.inputPath='';
  updateBoard();
  flushSaveState();
}
function rebuildMorseText(){
  let s='';
  for(const c of STATE.finalText){
    if(c===' ') s+='/ ';
    else if(MORSE_MAP[c]) s+=MORSE_MAP[c]+' ';
  }
  STATE.finalMorseText=s;
}
function appendSymbol(sym){
  STATE.inputPath+=sym;
  updateBoard();
  clearTimeout(STATE.inputTimer);
  currentCharEl.classList.remove('finalizing');
  void currentCharEl.offsetWidth;
  currentCharEl.classList.add('finalizing');
  STATE.inputTimer=setTimeout(finalizeLetter,800);
}

async function playCode(code,unit=100){
  if(SETTINGS.vibro&&navigator.vibrate){
    const pattern=[];
    for(const ch of code){
      if(ch==='.')pattern.push(unit,unit*2);
      else if(ch==='-')pattern.push(unit*3,unit*2);
    }
    navigator.vibrate(pattern);
  }
  for(const ch of code){
    if(STATE.abortPlayback) return;
    if(ch==='.'){Player.playTone(unit,'dot');await sleep(unit*2);}
    else if(ch==='-'){Player.playTone(unit*3,'dash');await sleep(unit*4);}
  }
  await sleep(unit*2);
}

async function replayOnce(){
  if(!STATE.finalText) return;
  if(STATE.replayInProgress){STATE.abortPlayback=true;return;}
  STATE.replayInProgress=true;STATE.abortPlayback=false;
  currentCharEl.textContent='';
  try{
    for(let i=0;i<STATE.finalText.length;i++){
      if(STATE.abortPlayback) break;
      const char=STATE.finalText[i];
      if(char===' '){await sleep(400);continue;}
      const node=NODES[char];
      if(!node) continue;
      renderFinalText(i);
      highlightPath(char);
      await playCode(node.code,100);
      resetLights();
      if(!STATE.abortPlayback) await sleep(100);
    }
  }finally{
    STATE.replayInProgress=false;
    renderFinalText(-1);
    resetLights();
  }
}

function handlePressStart(e){
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  STATE.abortPlayback=true;
  clearTimeout(STATE.inputTimer);
  currentCharEl.classList.remove('finalizing');
  morseKey.classList.add('active');
  STATE.pressStart=performance.now();
  Player.startContinuous();
}
function handlePressEnd(e){
  if(e) e.preventDefault();
  if(!STATE.pressStart) return;
  morseKey.classList.remove('active');
  Player.stopContinuous();
  const isDot=performance.now()-STATE.pressStart<SETTINGS.dotThreshold;
  STATE.pressStart=0;
  appendSymbol(isDot?'.':'-');
  morseKey.classList.remove('blink-green','blink-red');
  morseKey.classList.add(isDot?'blink-green':'blink-red');
  setTimeout(()=>morseKey.classList.remove('blink-green','blink-red'),isDot?150:450);
}
morseKey.addEventListener('pointerdown',e=>{
  if(SETTINGS.twoKeys){
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault();
    morseKey.setPointerCapture?.(e.pointerId);
    morseKey.classList.add('active');
    Player.playTone(100,'dot',morseKey);
  } else {
    morseKey.setPointerCapture?.(e.pointerId);
    handlePressStart(e);
  }
});
morseKey.addEventListener('pointerup',e=>{
  if(SETTINGS.twoKeys){
    e.preventDefault();
    morseKey.classList.remove('active');
    appendSymbol('.');
  } else {
    handlePressEnd(e);
  }
});
morseKey.addEventListener('pointercancel',e=>{
  if(SETTINGS.twoKeys){morseKey.classList.remove('active');}
  else{handlePressEnd(e);}
});
morseKey.addEventListener('pointerleave',e=>{
  if(!SETTINGS.twoKeys&&e.pointerType==='mouse'&&STATE.pressStart) handlePressEnd(e);
});

dashKey.addEventListener('pointerdown',e=>{
  if(!SETTINGS.twoKeys) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  dashKey.setPointerCapture?.(e.pointerId);
  dashKey.classList.add('active');
  Player.playTone(300,'dash',dashKey);
});
dashKey.addEventListener('pointerup',e=>{
  if(!SETTINGS.twoKeys) return;
  e.preventDefault();
  dashKey.classList.remove('active');
  appendSymbol('-');
});
dashKey.addEventListener('pointercancel',e=>{
  if(!SETTINGS.twoKeys) return;
  dashKey.classList.remove('active');
});

function handleResetStart(e){
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  STATE.resetLongFired=false;
  clearTimeout(STATE.resetTimer);
  STATE.resetTimer=setTimeout(()=>{STATE.resetLongFired=true;resetAll();},500);
}
function handleResetEnd(e){
  e.preventDefault();
  clearTimeout(STATE.resetTimer);STATE.resetTimer=null;
  if(!STATE.resetLongFired){
    clearTimeout(STATE.inputTimer);
    if(STATE.inputPath){STATE.inputPath='';updateBoard();flushSaveState();}
    else if(STATE.finalText){STATE.finalText=STATE.finalText.slice(0,-1);rebuildMorseText();updateBoard();flushSaveState();}
  }

}

async function runLoop(){
  while(STATE.looping){
    await replayOnce();
    if(!STATE.looping) break;
    await sleep(1000);
  }
}
function onAntennaTap(){
  STATE.antennaTapCount++;
  clearTimeout(STATE.antennaTimer);
  document.querySelectorAll('.antenna').forEach(el=>{el.classList.add('active');setTimeout(()=>el.classList.remove('active'),80);});
  STATE.antennaTimer=setTimeout(()=>{
    const count=STATE.antennaTapCount;
    STATE.antennaTapCount=0;
    if(count>=3){
      if(STATE.looping){STATE.looping=false;STATE.abortPlayback=true;}
      else{STATE.looping=true;runLoop();}
    } else if(count===1){
      if(STATE.looping){STATE.looping=false;STATE.abortPlayback=true;}
      else if(STATE.replayInProgress){STATE.abortPlayback=true;}
      else{replayOnce();}
    }
  },700);
}
document.querySelectorAll('.antenna-hit').forEach(el=>{

});

function kbKeyDown(e){

      morseKey.classList.add('active');
      STATE.pressStart=performance.now();

  }
  else if(e.code==='Enter'){e.preventDefault();addSpace();}
  else if(e.code==='Escape'){e.preventDefault();resetAll();}
}
function kbKeyUp(e){
  if(e.code==='Space'&&STATE.pressStart){e.preventDefault();handlePressEnd();}
}

function drawTraces(mode){
  const g=$('traces-group');g.innerHTML='';
  for(const ch in NODES){
    if(ch==='root') continue;
    const n=NODES[ch],p=NODES[n.parent];if(!p) continue;
    const np=getXY(n,mode),pp=getXY(p,mode);
    let d;
    if(pp.y===np.y||pp.x===np.x) d=`M${pp.x} ${pp.y}L${np.x} ${np.y}`;
    else{const my=pp.y+(np.y-pp.y)*(n.parent==='root'?.35:.5);d=`M${pp.x} ${pp.y}L${pp.x} ${my}L${np.x} ${my}L${np.x} ${np.y}`;}
    g.appendChild(mkEl('path',{d,class:'pcb-trace',id:`trace-${n.parent}-${ch}`}));
  }
}
function drawComponents(mode){
  const g=$('components-group');g.innerHTML='';
  const S=SIZES[mode];
  for(const ch in NODES){
    if(ch==='root') continue;
    const n=NODES[ch],{x,y}=getXY(n,mode);
    const grp=mkEl('g');grp.style.cursor='pointer';
    grp.addEventListener('click',async()=>{
      if(STATE.replayInProgress){STATE.abortPlayback=true;await sleep(350);}
      STATE.abortPlayback=false;
      clearTimeout(STATE.inputTimer);resetLights();
      const path=[];let c=ch;
      while(c!=='root'){path.unshift(c);c=NODES[c].parent;}
      for(const step of path){
        const s=NODES[step],sym=s.code.slice(-1);
        const dur=sym==='.'?100:300;
        $(`node-${step}`)?.classList.add('active');
        $(`trace-${s.parent}-${step}`)?.classList.add('active');
        vibrate(dur);
        Player.playTone(dur,sym==='.'?'dot':'dash');
        await sleep(sym==='.'?200:400);
      }
      await sleep(500);resetLights();
    });
    const isCircle=n.shape==='led'||n.shape==='circle';
    const shape=isCircle
      ? mkEl('circle',{cx:x,cy:y,r:S.r})
      : mkEl('rect',{x:x-S.w/2,y:y-S.h/2,width:S.w,height:S.h,rx:S.rx});
    shape.setAttribute('class',`pad-shape ${isCircle?'circle-shape':'rect-shape'}`);
    shape.id=`node-${ch}`;
    let ty;
    if(mode==='portrait') ty=y>=700?y+40:(isCircle?y-32:y-30);
    else ty=y===390?y+24:(isCircle?y-20:y-18);
    grp.append(shape,mkEl('text',{x,y:ty,class:'pad-text',id:`text-${ch}`},ch));
    g.appendChild(grp);
  }
}
function applyMode(mode){
  currentMode=mode;
  boardSvg.setAttribute('viewBox',VIEWBOX[mode]);
  drawTraces(mode);
  drawComponents(mode);
  updateBoard();
}
function switchMode(newMode){
  STATE.abortPlayback=true;
  if(STATE.pressStart){morseKey.classList.remove('active');Player.stopContinuous();STATE.pressStart=0;}
  resetLights();
  applyMode(newMode);
}

const modal=$('settings-modal');
$('settings-btn').addEventListener('click',()=>modal.classList.add('open'));
$('close-modal').addEventListener('click',()=>modal.classList.remove('open'));

$('lang-toggle').addEventListener('click',()=>{
  applyLanguage(currentLang==='en'?'ru':'en');
});

$('tone').value=SETTINGS.tone;
$('tone-val').textContent=SETTINGS.tone;
$('tone').addEventListener('input',e=>{SETTINGS.tone=+e.target.value;$('tone-val').textContent=SETTINGS.tone;saveSettings();});

$('vol').value=Math.round(SETTINGS.volume*100);
$('vol-val').textContent=Math.round(SETTINGS.volume*100);
$('vol').addEventListener('input',e=>{SETTINGS.volume=+e.target.value/100;$('vol-val').textContent=+e.target.value;saveSettings();});

$('dot-val').textContent=SETTINGS.dotThreshold;
$('dot-btn').addEventListener('click',()=>{
  const i=DOT_VALUES.indexOf(SETTINGS.dotThreshold);
  SETTINGS.dotThreshold=DOT_VALUES[(i+1)%DOT_VALUES.length];
  $('dot-val').textContent=SETTINGS.dotThreshold;
  saveSettings();
  vibrate(30);
});

function updateToggle(btn,on){
  btn.classList.toggle('on',on);
  btn.querySelector('.state-txt').textContent=on?'ON':'OFF';
}
const vibroBtn=$('vibro-toggle'),torchBtn=$('torch-toggle'),twoKeysBtn=$('twokeys-toggle');

vibroBtn.disabled=!canVibrate;
updateToggle(vibroBtn,SETTINGS.vibro&&canVibrate);
vibroBtn.addEventListener('click',()=>{
  if(!canVibrate) return;
  SETTINGS.vibro=!SETTINGS.vibro;
  storage.setItem(STORAGE_KEYS.vibro,SETTINGS.vibro?'1':'0');
  updateToggle(vibroBtn,SETTINGS.vibro);
  if(SETTINGS.vibro) navigator.vibrate?.(60);
});

updateToggle(torchBtn,SETTINGS.torch);
torchBtn.addEventListener('click',async()=>{
  if(SETTINGS.torch){
    SETTINGS.torch=false;storage.setItem(STORAGE_KEYS.torch,'0');
    updateToggle(torchBtn,false);
    $('ind-torch').classList.remove('on');
    torchOffHold();
    setTimeout(releaseTorch,150);
  } else {
    const ok=await ensureTorch();
    if(!ok){
      setStatus(I18N[currentLang].torchUnavail);
      return;
    }
    SETTINGS.torch=true;storage.setItem(STORAGE_KEYS.torch,'1');
    updateToggle(torchBtn,true);
    $('ind-torch').classList.add('on');
    setTorch(true);
    setTimeout(()=>{if(!STATE.torchFlashTimer)setTorch(false);},300);
  }
});

function applyTwoKeyMode(){
  controlsRight.classList.toggle('two-keys',SETTINGS.twoKeys);
  updateToggle(twoKeysBtn,SETTINGS.twoKeys);
}
updateToggle(twoKeysBtn,SETTINGS.twoKeys);
twoKeysBtn.addEventListener('click',()=>{
  SETTINGS.twoKeys=!SETTINGS.twoKeys;
  storage.setItem(STORAGE_KEYS.twoKeys,SETTINGS.twoKeys?'1':'0');
  applyTwoKeyMode();
});

function safetyStop(){
  if(STATE.pressStart){morseKey.classList.remove('active');Player.stopContinuous();STATE.pressStart=0;}
  if(STATE.resetTimer){clearTimeout(STATE.resetTimer);STATE.resetTimer=null;}
  if(STATE.antennaTimer){clearTimeout(STATE.antennaTimer);STATE.antennaTimer=null;}
  setAntennaInputting(false);
  torchOffHold();
  stopKeyVibrate();
  STATE.looping=false;
  STATE.abortPlayback=true;
}
window.addEventListener('blur',safetyStop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)safetyStop();});

let resizeTimer=null;
function detectMode(){return window.matchMedia('(orientation: portrait)').matches?'portrait':'landscape';}
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{const m=detectMode();if(m!==currentMode) switchMode(m);},150);
});

(function(){
  const installBtn=$('install-btn'),iosHint=$('ios-hint');
  if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone) return;
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.classList.add('visible');});
  installBtn.addEventListener('click',async()=>{
    if(!deferredPrompt) return;
    installBtn.classList.remove('visible');
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
  });
  window.addEventListener('appinstalled',()=>{installBtn.classList.remove('visible');deferredPrompt=null;});
  if(isIOS&&!storage.getItem('iosHintShown')){
    setTimeout(()=>{iosHint.classList.add('visible');storage.setItem('iosHintShown','1');},2500);
    $('close-ios-hint').addEventListener('click',()=>iosHint.classList.remove('visible'));
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    if(location.protocol==='https:'||location.hostname==='localhost'){
      navigator.serviceWorker.register('./sw.js').then(reg=>{
        document.addEventListener('visibilitychange',()=>{
          if(!document.hidden) reg.update().catch(()=>{});
        });
        setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
      }).catch(e=>console.warn('[SW]',e));
    }
  });
}

loadSettings();
loadState();
stateLoaded=true;
applyLanguage(currentLang);
applyTwoKeyMode();
window.addEventListener('keydown',kbKeyDown);
window.addEventListener('keyup',kbKeyUp);
applyMode(currentMode);

if(SETTINGS.torch){
  ensureTorch().then(ok=>{
    if(ok){
      $('ind-torch').classList.add('on');
    } else {
      SETTINGS.torch=false;
      storage.setItem(STORAGE_KEYS.torch,'0');
      updateToggle(torchBtn,false);
    }
  });
}
</script>
</body>
</html>
