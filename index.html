<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MORSE CODE Gadget</title>
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Интерактивный тренажер и передатчик азбуки Морзе">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="./icons/favicon-96x96.png">
<link rel="icon" type="image/x-icon" href="./icons/favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morse">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0a0c10;--board-bg:#12161a;--gold:#c9a227;--gold-bright:#f0c94a;--gold-dim:#5c4711;--green:#39ff88;--red:#ff3333;--text:#fff;--control-width:clamp(45px,9vw,75px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;height:100dvh;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.app-container{display:flex;flex-direction:column;width:100vw;height:100dvh}
header{width:100%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;z-index:10;background:var(--bg)}
#morse-display{font-size:1.1rem;color:var(--gold);letter-spacing:6px;font-family:monospace;font-weight:bold;min-height:1.3em;text-align:center;text-shadow:0 0 10px rgba(201,162,39,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;max-width:100%}
#decoded{font-size:2rem;color:var(--green);min-height:1.4em;text-align:center;letter-spacing:2px;font-weight:bold;text-shadow:0 0 15px rgba(57,255,136,.4);font-family:monospace;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;overflow:hidden;white-space:nowrap;padding:0 10px}
#final-text{color:#fff;text-shadow:none;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
#current-char{color:var(--gold);text-shadow:0 0 10px rgba(201,162,39,.5);flex:0 0 auto}
.main-content{display:flex;flex:1;flex-direction:row;width:100%;overflow:hidden;position:relative}
.spacer-left{flex:0 0 var(--control-width)}
.controls-right{flex:0 0 var(--control-width);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:10px 0;z-index:10}
.board-container{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;min-width:0}
#board-svg{width:100%;height:100%;max-width:100%;display:block}
#settings-btn{position:absolute;top:10px;right:10px;z-index:50;width:40px;height:40px;cursor:pointer;fill:#7a828c;transition:fill .2s,transform .2s}
#settings-btn:hover{fill:var(--gold);transform:rotate(45deg)}
.side-btn{width:clamp(35px,7vw,50px);height:clamp(35px,7vw,50px);border-radius:50%;background:linear-gradient(to bottom,#2a3038,#1a1e24);color:var(--gold);border:2px solid #4a5058;border-bottom:5px solid #0a0c10;font-family:'Courier New',monospace;font-size:.6rem;font-weight:bold;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .05s,border-bottom .05s;box-shadow:0 5px 10px rgba(0,0,0,.5);padding:5px;touch-action:manipulation}
.side-btn:active{transform:translateY(3px);border-bottom:2px solid #0a0c10}
.main-key-btn{width:clamp(55px,11vw,80px);height:clamp(55px,11vw,80px);border-radius:50%;background:radial-gradient(circle at 35% 35%,#4a5058,#1a1e24);border:3px solid #5a6068;border-bottom:8px solid #0a0c10;box-shadow:0 10px 25px rgba(0,0,0,.8),inset 0 2px 5px rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .05s,border-bottom .05s;position:relative;touch-action:manipulation}
.main-key-btn::after{content:'';width:40%;height:40%;border-radius:50%;background:#2a3038;box-shadow:inset 0 3px 6px rgba(0,0,0,.8);transition:background .1s,box-shadow .1s}
.main-key-btn.active{transform:translateY(5px);border-bottom:3px solid #0a0c10;background:radial-gradient(circle at 35% 35%,#5a6068,#2a3038)}
.main-key-btn.active::after{background:var(--gold-bright);box-shadow:0 0 25px var(--gold-bright)}
.main-key-btn.blink-green::after{background:var(--green);box-shadow:0 0 25px var(--green)}
.main-key-btn.blink-red::after{background:var(--red);box-shadow:0 0 25px var(--red)}
.modal{position:fixed;inset:0;width:100vw;height:100dvh;background:linear-gradient(to bottom,#14181d,#0a0c10);transform:translateY(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:1000;display:flex;flex-direction:column;padding:30px 20px;overflow-y:auto}
.modal.open{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.modal-header h2{margin:0;color:var(--gold);font-size:1.5rem;letter-spacing:2px}
.close-modal{background:none;border:none;color:var(--text);font-size:2rem;cursor:pointer;padding:0}
.controls{display:flex;flex-direction:column;gap:15px;width:100%;max-width:500px;margin:0 auto}
button.tool-btn{background:linear-gradient(to bottom,#2a3038,#1a1e24);color:var(--gold);border:1px solid #3a4048;border-bottom:4px solid #0a0c10;border-radius:12px;padding:15px;font-family:inherit;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:transform .05s}
button.tool-btn:active{transform:translateY(2px);border-bottom:2px solid #0a0c10}
button.tool-btn-gold{background:linear-gradient(to bottom,var(--gold-bright),var(--gold));color:#0a0c10;border:1px solid #8a6e1a;border-bottom:4px solid #4a3810}
button.tool-btn-gold:active{border-bottom:2px solid #4a3810}
.beta{font-size:.7em;opacity:.7;margin-left:4px;font-weight:normal}
#install-btn{display:none}
#install-btn.visible{display:block}
.settings{display:flex;flex-direction:column;gap:20px;margin:40px auto 0;font-size:1.1rem;max-width:500px;width:100%}
.setting-row{display:flex;justify-content:space-between;align-items:center}
.setting-row label{flex:1}
input[type=range]{width:60%;accent-color:var(--green)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);cursor:pointer}
.hint{font-size:.75rem;color:#7a828c;margin-top:4px}
#status{font-size:.9rem;color:#7a828c;margin-top:30px;text-align:center}
.pcb-bg{fill:var(--board-bg)}
.pcb-dots{fill:#1c2228}
.pcb-trace{fill:none;stroke:var(--gold-dim);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,stroke-width .15s}
.pcb-trace.active{stroke:var(--gold-bright);stroke-width:5;filter:drop-shadow(0 0 6px var(--gold-bright))}
.pad-shape{fill:var(--board-bg);stroke:var(--gold);stroke-width:3;transition:all .15s}
.pad-shape.rect-shape.active{fill:var(--red);stroke:#fff;filter:drop-shadow(0 0 10px var(--red))}
.pad-shape.circle-shape.active{fill:var(--green);stroke:#fff;filter:drop-shadow(0 0 10px var(--green))}
.antenna{stroke:#7a828c;fill:none;stroke-width:4;transition:stroke .15s,filter .15s;cursor:pointer;touch-action:none}
.antenna:hover{stroke:var(--gold)}
.antenna.active{stroke:#fff;filter:drop-shadow(0 0 8px #fff)}
.pad-text{fill:var(--text);font-family:Arial,sans-serif;font-size:20px;font-weight:900;text-anchor:middle;dominant-baseline:middle;pointer-events:none;stroke:var(--bg);stroke-width:5px;paint-order:stroke fill}
.board-title{fill:#7a828c;font-family:sans-serif;font-size:24px;font-weight:bold;letter-spacing:4px;opacity:.8}
#ios-hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:900;background:rgba(20,24,29,.95);color:var(--text);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;font-size:.8rem;max-width:320px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.8);display:none}
#ios-hint.visible{display:block}
#ios-hint b{color:var(--gold-bright)}
#ios-hint .close-hint{position:absolute;top:4px;right:8px;cursor:pointer;color:#7a828c;font-weight:bold;font-size:1rem}
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div id="morse-display"></div>
    <div id="decoded"><span id="final-text"></span><span id="current-char"></span></div>
  </header>

  <div class="main-content">
    <div class="spacer-left"></div>
    <div class="board-container">
      <svg id="settings-btn" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>

      <svg id="board-svg" viewBox="-20 20 1080 440" preserveAspectRatio="xMidYMid meet">
        <rect x="-20" y="20" width="1120" height="440" class="pcb-bg"/>
        <pattern id="pcb-dots" x="-20" y="20" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" class="pcb-dots"/></pattern>
        <rect x="-20" y="20" width="1120" height="440" fill="url(#pcb-dots)"/>
        <text x="140" y="60" class="board-title">MORSE</text>
        <text x="840" y="60" class="board-title">CODE</text>
        <path id="antenna-symbol" class="antenna" d="M 520 35 L 520 85 M 490 85 L 550 85 M 505 100 L 535 100 L 520 85 Z"/>
        <g id="traces-group"></g>
        <g id="components-group"></g>
      </svg>
    </div>
    <div class="controls-right">
      <button id="btn-space" class="side-btn">SPACE</button>
      <button id="morse-key" class="main-key-btn" aria-label="Morse Key"></button>
      <button id="btn-reset" class="side-btn">RESET</button>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal">
  <div class="modal-header"><h2>SETTINGS</h2><button class="close-modal" id="close-modal">✕</button></div>
  <div class="controls">
    <button class="tool-btn" id="btn-mic">🎤 Микрофон <span class="beta">Beta</span></button>
    <button class="tool-btn tool-btn-gold" id="install-btn" title="Установить на главный экран">⬇ Установить приложение</button>
  </div>
  <div class="settings">
    <div class="setting-row"><label>Вибро (набор + повтор)</label><input type="checkbox" id="vibro-toggle"></div>
    <div>
      <div class="setting-row"><label>Фонарик (набор + повтор)</label><input type="checkbox" id="torch-toggle"></div>
      <div class="hint">Требует доступ к камере (веб-API)</div>
    </div>
    <div class="setting-row"><label>Тон: <span id="tone-val">700 Гц</span></label><input type="range" id="tone" min="400" max="1000" value="700" step="50"></div>
    <div class="setting-row"><label>Громкость:</label><input type="range" id="vol" min="0" max="1" value="0.5" step="0.1"></div>
  </div>
  <div id="status">KEY: короткое — ТОЧКА, длинное — ТИРЕ.<br>Антенна: тап — повтор, удержание &gt;3с — цикл.<br>RESET: тап — удалить символ, удержание — очистить.</div>
</div>

<div id="ios-hint"><span class="close-hint" id="close-ios-hint">✕</span>Установите приложение: нажмите <b>«Поделиться»</b> <br>и выберите <b>«На экран „Домой“»</b></div>

<script>
/* --- Safe storage --- */
const storage=(()=>{
  try{const t='_t'+Math.random();localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}
  catch{const d={};return{getItem:k=>k in d?d[k]:null,setItem:(k,v)=>{d[k]=String(v);},removeItem:k=>{delete d[k];}};}
})();

const NODES={
  root:{x:520,y:110,shape:'none',code:'',parent:null},
  T:{x:240,y:150,shape:'rect-h',code:'-',parent:'root'}, E:{x:800,y:150,shape:'led',code:'.',parent:'root'},
  M:{x:100,y:230,shape:'rect-h',code:'--',parent:'T'}, N:{x:380,y:230,shape:'circle',code:'-.',parent:'T'},
  A:{x:660,y:230,shape:'rect-h',code:'.-',parent:'E'}, I:{x:940,y:230,shape:'led',code:'..',parent:'E'},
  O:{x:60,y:310,shape:'rect-h',code:'---',parent:'M'}, G:{x:140,y:310,shape:'circle',code:'--.',parent:'M'},
  K:{x:300,y:310,shape:'rect-h',code:'-.-',parent:'N'}, D:{x:460,y:310,shape:'circle',code:'-..',parent:'N'},
  R:{x:600,y:310,shape:'circle',code:'.-.',parent:'A'}, W:{x:720,y:310,shape:'rect-h',code:'.--',parent:'A'},
  S:{x:880,y:310,shape:'led',code:'...',parent:'I'}, U:{x:1000,y:310,shape:'rect-h',code:'..-',parent:'I'},
  Q:{x:100,y:390,shape:'rect-h',code:'--.-',parent:'G'}, Z:{x:180,y:390,shape:'circle',code:'--..',parent:'G'},
  Y:{x:260,y:390,shape:'rect-h',code:'-.--',parent:'K'}, C:{x:340,y:390,shape:'circle',code:'-.-.',parent:'K'},
  X:{x:420,y:390,shape:'rect-h',code:'-..-',parent:'D'}, B:{x:500,y:390,shape:'circle',code:'-...',parent:'D'},
  L:{x:600,y:390,shape:'circle',code:'.-..',parent:'R'}, J:{x:680,y:390,shape:'rect-h',code:'.---',parent:'W'},
  P:{x:760,y:390,shape:'circle',code:'.--.',parent:'W'}, H:{x:840,y:390,shape:'led',code:'....',parent:'S'},
  V:{x:920,y:390,shape:'rect-h',code:'...-',parent:'S'}, F:{x:1000,y:390,shape:'circle',code:'..-.',parent:'U'}
};
const MORSE_MAP={};
for(const k in NODES) if(NODES[k].code) MORSE_MAP[k]=NODES[k].code;

const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mkEl=(tag,attrs,txt)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;};

const finalTextEl=$('final-text'), currentCharEl=$('current-char'), morseDisplayEl=$('morse-display');
const morseKey=$('morse-key'), antennaSymbol=$('antenna-symbol');
let inputPath='', finalText='', finalMorseText='';
let inputTimer=null, pressStartTime=0;
let audioCtx=null, currentVolume=0.5, currentTone=700;
let continuousToneOsc=null, continuousToneGain=null;
let vibroEnabled=storage.getItem('vibro')==='1';
let torchEnabled=storage.getItem('torch')==='1';
let torchStream=null, torchTrack=null, torchIniting=false, flashTimer=null;
let looping=false, willLoop=false, antennaTimer=null, antennaPressStart=0;
let abortPlayback=false, replayInProgress=false;

/* ===================== VIBRO ===================== */
const vibrate=p=>{if(vibroEnabled) navigator.vibrate?.(p);};
let keyVibrateTimer=null;
function startKeyVibrate(){
  if(!vibroEnabled || !navigator.vibrate) return;
  stopKeyVibrate();
  navigator.vibrate(100);
  keyVibrateTimer=setInterval(()=>navigator.vibrate(100), 200);
}
function stopKeyVibrate(){
  if(keyVibrateTimer){clearInterval(keyVibrateTimer); keyVibrateTimer=null;}
  if(navigator.vibrate) navigator.vibrate(0);
}

/* ===================== TORCH ===================== */
function setTorch(on){
  if(!torchTrack) return;
  torchTrack.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});
}
async function ensureTorch(){
  if(torchTrack) return true;
  if(torchIniting) return false;
  if(!navigator.mediaDevices?.getUserMedia) return false;
  torchIniting=true;
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const t=s.getVideoTracks()[0];
    const caps=t.getCapabilities?t.getCapabilities():{};
    if(!caps.torch){s.getTracks().forEach(x=>x.stop()); return false;}
    torchStream=s; torchTrack=t;
    return true;
  }catch{return false;}
  finally{torchIniting=false;}
}
function releaseTorch(){
  if(torchStream){torchStream.getTracks().forEach(t=>t.stop()); torchStream=null;}
  torchTrack=null;
  clearTimeout(flashTimer); flashTimer=null;
}
function triggerFlash(ms){
  if(!torchEnabled) return;
  if(!torchTrack){ensureTorch(); return;}
  clearTimeout(flashTimer);
  setTorch(true);
  flashTimer=setTimeout(()=>{setTorch(false); flashTimer=null;}, ms);
}
function torchOnHold(){
  if(!torchEnabled) return;
  if(!torchTrack){ensureTorch().then(ok=>{if(ok) setTorch(true);}); return;}
  clearTimeout(flashTimer); flashTimer=null;
  setTorch(true);
}
function torchOffHold(){
  if(!torchEnabled) return;
  clearTimeout(flashTimer); flashTimer=null;
  setTorch(false);
}

/* ===================== LIGHTS ===================== */
const resetLights=()=>document.querySelectorAll('.pad-shape, .pcb-trace').forEach(el=>el.classList.remove('active'));
function highlightPath(char){
  let cur=char;
  while(cur&&cur!=='root'){
    const n=NODES[cur]; if(!n?.parent) break;
    $(`node-${cur}`)?.classList.add('active');
    $(`trace-${n.parent}-${cur}`)?.classList.add('active');
    cur=n.parent;
  }
}

/* ===================== BOARD STATE ===================== */
function updateBoard(){
  resetLights();
  finalTextEl.textContent=finalText?finalText+' ':'';
  if(!inputPath){currentCharEl.textContent='';morseDisplayEl.textContent=finalMorseText.trim();return;}
  morseDisplayEl.textContent=(finalMorseText+' '+inputPath.split('').join(' ')).trim();
  const char=Object.keys(MORSE_MAP).find(k=>MORSE_MAP[k]===inputPath);
  currentCharEl.textContent=char||'?';
  if(char) highlightPath(char);
}
function finalizeLetter(){
  if(!inputPath) return;
  clearTimeout(inputTimer);
  currentCharEl.classList.remove('finalizing');
  const char=Object.keys(MORSE_MAP).find(k=>MORSE_MAP[k]===inputPath);
  finalText+=char||'?'; finalMorseText+=inputPath+' ';
  inputPath=''; updateBoard();
}
function rebuildMorseText(){
  let s='';
  for(const c of finalText){
    if(c===' ') s+='/ ';
    else if(MORSE_MAP[c]) s+=MORSE_MAP[c]+' ';
  }
  finalMorseText=s;
}

/* ===================== AUDIO ===================== */
function initAudio(){ if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); }

function startContinuousTone(){
  initAudio();
  continuousToneOsc=audioCtx.createOscillator(); continuousToneGain=audioCtx.createGain();
  continuousToneOsc.type='sine'; continuousToneOsc.frequency.value=currentTone; continuousToneGain.gain.value=currentVolume;
  continuousToneOsc.connect(continuousToneGain); continuousToneGain.connect(audioCtx.destination);
  morseKey.classList.remove('blink-green'); morseKey.classList.add('blink-red');
  antennaSymbol.classList.add('active'); continuousToneOsc.start();
  startKeyVibrate();
  torchOnHold();
}
function stopContinuousTone(){
  if(continuousToneOsc){
    continuousToneOsc.stop(); continuousToneOsc.disconnect(); continuousToneGain.disconnect(); continuousToneOsc=null;
  }
  morseKey.classList.remove('blink-red','blink-green'); antennaSymbol.classList.remove('active');
  stopKeyVibrate();
  torchOffHold();
}
function playTone(ms,type='dot'){
  initAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='sine'; o.frequency.value=currentTone; g.gain.value=currentVolume;
  o.connect(g); g.connect(audioCtx.destination);
  morseKey.classList.remove('blink-green','blink-red');
  morseKey.classList.add(type==='dot'?'blink-green':'blink-red');
  antennaSymbol.classList.add('active');
  triggerFlash(ms);
  o.start();
  setTimeout(()=>{o.stop();g.disconnect();morseKey.classList.remove('blink-green','blink-red');antennaSymbol.classList.remove('active');},ms);
}
async function playCode(code,unit=100){
  if(vibroEnabled && navigator.vibrate){
    const pattern=[];
    for(const ch of code){
      if(ch==='.') pattern.push(unit, unit*2);
      else if(ch==='-') pattern.push(unit*3, unit*2);
    }
    navigator.vibrate(pattern);
  }
  for(const ch of code){
    if(abortPlayback) return;
    if(ch==='.'){playTone(unit,'dot'); await sleep(unit*2);}
    else if(ch==='-'){playTone(unit*3,'dash'); await sleep(unit*4);}
  }
  await sleep(unit*2);
}
async function replayOnce(){
  if(!finalText||replayInProgress) return;
  replayInProgress=true; abortPlayback=false;
  try{
    for(const char of finalText.trim()){
      if(abortPlayback) break;
      if(char===' '){await sleep(400); continue;}
      const node=NODES[char]; if(!node) continue;
      highlightPath(char);
      await playCode(node.code,100);
      resetLights();
    }
  } finally{
    replayInProgress=false;
    resetLights();
  }
}

/* ===================== KEY ===================== */
function handlePressStart(e){
  e.preventDefault(); clearTimeout(inputTimer); currentCharEl.classList.remove('finalizing');
  morseKey.classList.add('active'); pressStartTime=performance.now(); startContinuousTone();
}
function handlePressEnd(e){
  if(e) e.preventDefault();
  if(!pressStartTime) return;
  morseKey.classList.remove('active'); stopContinuousTone();
  const isDot=performance.now()-pressStartTime<200; pressStartTime=0;
  inputPath+=isDot?'.':'-'; updateBoard();
  morseKey.classList.remove('blink-green','blink-red');
  morseKey.classList.add(isDot?'blink-green':'blink-red');
  setTimeout(()=>morseKey.classList.remove('blink-green','blink-red'),isDot?150:450);
  currentCharEl.classList.remove('finalizing'); void currentCharEl.offsetWidth; currentCharEl.classList.add('finalizing');
  inputTimer=setTimeout(finalizeLetter,800);
}
morseKey.addEventListener('mousedown',handlePressStart);
morseKey.addEventListener('touchstart',handlePressStart,{passive:false});
morseKey.addEventListener('mouseup',handlePressEnd);
morseKey.addEventListener('touchend',handlePressEnd);
morseKey.addEventListener('pointercancel',handlePressEnd);
morseKey.addEventListener('mouseleave',()=>pressStartTime&&handlePressEnd());

/* ===================== SPACE ===================== */
$('btn-space').addEventListener('click',()=>{
  clearTimeout(inputTimer); finalizeLetter();
  finalText+=' '; finalMorseText+='/ '; updateBoard();
});

/* ===================== RESET ===================== */
let resetTimer=null, resetLongFired=false;
function handleResetStart(e){
  e.preventDefault();
  resetLongFired=false;
  clearTimeout(resetTimer);
  resetTimer=setTimeout(()=>{
    resetLongFired=true;
    clearTimeout(inputTimer);
    inputPath=''; finalText=''; finalMorseText='';
    currentCharEl.classList.remove('finalizing');
    updateBoard();
    vibrate(80);
  },500);
}
function handleResetEnd(e){
  e.preventDefault();
  clearTimeout(resetTimer); resetTimer=null;
  if(!resetLongFired){
    clearTimeout(inputTimer);
    if(inputPath){
      inputPath='';
      currentCharEl.classList.remove('finalizing');
      updateBoard();
    } else if(finalText){
      finalText=finalText.slice(0,-1);
      rebuildMorseText();
      updateBoard();
    }
  }
  resetLongFired=false;
}
const resetBtn=$('btn-reset');
resetBtn.addEventListener('mousedown',handleResetStart);
resetBtn.addEventListener('touchstart',handleResetStart,{passive:false});
resetBtn.addEventListener('mouseup',handleResetEnd);
resetBtn.addEventListener('touchend',handleResetEnd);
resetBtn.addEventListener('pointercancel',handleResetEnd);
resetBtn.addEventListener('mouseleave',e=>{if(resetTimer)handleResetEnd(e);});

/* ===================== ANTENNA ===================== */
async function runLoop(){
  while(looping){
    await replayOnce();
    if(!looping) break;
    await sleep(1000);
  }
}
function handleAntennaStart(e){
  e.preventDefault();
  if(looping){looping=false; abortPlayback=true; return;}
  antennaPressStart=performance.now();
  willLoop=false;
  clearTimeout(antennaTimer);
  antennaTimer=setTimeout(()=>{
    willLoop=true;
    vibrate(100);
  },3000);
}
function handleAntennaEnd(e){
  e.preventDefault();
  clearTimeout(antennaTimer);
  if(looping) return;
  const wasLong=willLoop, wasShort=!!antennaPressStart;
  willLoop=false; antennaPressStart=0;
  if(wasLong){looping=true; runLoop();}
  else if(wasShort){replayOnce();}
}
antennaSymbol.addEventListener('mousedown',handleAntennaStart);
antennaSymbol.addEventListener('mouseup',handleAntennaEnd);
antennaSymbol.addEventListener('mouseleave',e=>{if(antennaPressStart)handleAntennaEnd(e);});
antennaSymbol.addEventListener('touchstart',handleAntennaStart,{passive:false});
antennaSymbol.addEventListener('touchend',handleAntennaEnd);
antennaSymbol.addEventListener('pointercancel',handleAntennaEnd);

/* ===================== DRAW ===================== */
function drawTraces(){
  const g=$('traces-group'); g.innerHTML='';
  for(const ch in NODES){
    if(ch==='root') continue;
    const n=NODES[ch], p=NODES[n.parent]; if(!p) continue;
    let d;
    if(p.y===n.y||p.x===n.x) d=`M${p.x} ${p.y}L${n.x} ${n.y}`;
    else{const my=p.y+(n.y-p.y)*0.5; d=`M${p.x} ${p.y}L${p.x} ${my}L${n.x} ${my}L${n.x} ${n.y}`;}
    g.appendChild(mkEl('path',{d,class:'pcb-trace',id:`trace-${n.parent}-${ch}`}));
  }
}
function drawComponents(){
  const g=$('components-group'); g.innerHTML='';
  for(const ch in NODES){
    if(ch==='root') continue;
    const n=NODES[ch];
    const grp=mkEl('g'); grp.style.cursor='pointer';
    grp.addEventListener('click',async()=>{
      clearTimeout(inputTimer); currentCharEl.classList.remove('finalizing'); resetLights();
      const path=[]; let c=ch;
      while(c!=='root'){path.unshift(c); c=NODES[c].parent;}
      for(const step of path){
        const s=NODES[step], sym=s.code.slice(-1);
        const dur=sym==='.'?100:300;
        $(`node-${step}`)?.classList.add('active');
        $(`trace-${s.parent}-${step}`)?.classList.add('active');
        vibrate(dur);
        playTone(dur,sym==='.'?'dot':'dash');
        await sleep(sym==='.'?200:400);
      }
      await sleep(500); resetLights();
    });
    const isCircle=n.shape==='led'||n.shape==='circle';
    const shape=isCircle
      ? mkEl('circle',{cx:n.x,cy:n.y,r:12})
      : mkEl('rect',{x:n.x-18,y:n.y-6,width:36,height:12,rx:3});
    shape.setAttribute('class',`pad-shape ${isCircle?'circle-shape':'rect-shape'}`);
    shape.id=`node-${ch}`;
    const ty=n.y===390?n.y+24:(isCircle?n.y-20:n.y-18);
    grp.append(shape, mkEl('text',{x:n.x,y:ty,class:'pad-text',id:`text-${ch}`},ch));
    g.appendChild(grp);
  }
}

/* ===================== SETTINGS ===================== */
const modal=$('settings-modal');
$('settings-btn').addEventListener('click',()=>modal.classList.add('open'));
$('close-modal').addEventListener('click',()=>modal.classList.remove('open'));
$('tone').addEventListener('input',e=>{currentTone=+e.target.value; $('tone-val').textContent=currentTone+' Гц';});
$('vol').addEventListener('input',e=>{currentVolume=+e.target.value;});

const setStatus=msg=>$('status').textContent=msg;

$('vibro-toggle').checked=vibroEnabled;
$('vibro-toggle').addEventListener('change',e=>{
  vibroEnabled=e.target.checked;
  storage.setItem('vibro',vibroEnabled?'1':'0');
  if(vibroEnabled) navigator.vibrate?.(60);
});

$('torch-toggle').checked=torchEnabled;
$('torch-toggle').addEventListener('change',async e=>{
  if(e.target.checked){
    const ok=await ensureTorch();
    if(!ok){e.target.checked=false; setStatus('Фонарик недоступен на этом устройстве'); return;}
    torchEnabled=true; storage.setItem('torch','1');
    setTorch(true); setTimeout(()=>{if(!flashTimer) setTorch(false);},300);
  } else {
    torchEnabled=false; storage.setItem('torch','0');
    torchOffHold();
    setTimeout(releaseTorch,150);
  }
});

/* ===================== MICROPHONE (Beta) ===================== */
let micStream=null, micActive=false, micAnalyser=null, micData=null;
let micLastTone=false, micToneStart=0, micToneEnd=0;
let micAnimId=null;

async function toggleMic(){
  initAudio();
  if(micActive){
    if(micAnimId){cancelAnimationFrame(micAnimId); micAnimId=null;}
    micStream?.getTracks().forEach(t=>t.stop());
    micStream=null; micActive=false;
    micLastTone=false; micToneStart=0; micToneEnd=0;
    if(inputPath) finalizeLetter();
    morseKey.classList.remove('blink-red');
    antennaSymbol.classList.remove('active');
    setStatus('Микрофон выключен');
    return;
  }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    micAnalyser=audioCtx.createAnalyser();
    micAnalyser.fftSize=1024;
    micAnalyser.smoothingTimeConstant=0.6;
    audioCtx.createMediaStreamSource(micStream).connect(micAnalyser);
    micData=new Uint8Array(micAnalyser.frequencyBinCount);
    micActive=true; inputPath='';
    micLastTone=false; micToneStart=0; micToneEnd=0;
    setStatus('Слушаю... (Beta)');
    micAnimId=requestAnimationFrame(processMic);
  } catch {
    setStatus('Ошибка микрофона (нет доступа)');
  }
}
function processMic(){
  if(!micActive) return;
  micAnalyser.getByteFrequencyData(micData);
  const binHz=audioCtx.sampleRate/micAnalyser.fftSize;
  let maxVal=0;
  for(let i=Math.floor(400/binHz); i<Math.floor(1200/binHz)&&i<micData.length; i++)
    if(micData[i]>maxVal) maxVal=micData[i];
  const present=maxVal>80, now=performance.now();

  if(present&&!micLastTone){
    micToneStart=now;
    morseKey.classList.add('blink-red');
    antennaSymbol.classList.add('active');
  } else if(!present&&micLastTone){
    micToneEnd=now;
    morseKey.classList.remove('blink-red');
    antennaSymbol.classList.remove('active');
    const dur=micToneEnd-micToneStart;
    if(dur>50&&dur<500){ inputPath+=dur<200?'.':'-'; updateBoard(); }
  }
  micLastTone=present;

  if(!present && inputPath && micToneEnd && now-micToneEnd>800){
    finalizeLetter();
    micToneEnd=0;
  }
  micAnimId=requestAnimationFrame(processMic);
}
$('btn-mic').addEventListener('click',toggleMic);

/* ===================== GLOBAL SAFETY ===================== */
function safetyStop(){
  if(pressStartTime){ morseKey.classList.remove('active'); stopContinuousTone(); pressStartTime=0; }
  if(resetTimer){clearTimeout(resetTimer); resetTimer=null;}
  if(antennaTimer){clearTimeout(antennaTimer); antennaTimer=null;}
  if(micAnimId){cancelAnimationFrame(micAnimId); micAnimId=null;}
  if(micActive){
    micStream?.getTracks().forEach(t=>t.stop());
    micStream=null; micActive=false;
    micLastTone=false; micToneStart=0; micToneEnd=0;
    morseKey.classList.remove('blink-red');
    antennaSymbol.classList.remove('active');
  }
  torchOffHold();
  stopKeyVibrate();
  looping=false; abortPlayback=true;
}
window.addEventListener('blur',safetyStop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)safetyStop();});

/* ===================== PWA ===================== */
(function(){
  const installBtn=$('install-btn'), iosHint=$('ios-hint');
  if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone) return;
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); deferredPrompt=e; installBtn.classList.add('visible');});
  installBtn.addEventListener('click',async()=>{
    if(!deferredPrompt) return;
    installBtn.classList.remove('visible');
    deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null;
  });
  window.addEventListener('appinstalled',()=>{installBtn.classList.remove('visible'); deferredPrompt=null;});
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(isIOS&&!storage.getItem('iosHintShown')){
    setTimeout(()=>{iosHint.classList.add('visible'); storage.setItem('iosHintShown','1');},2500);
    $('close-ios-hint').addEventListener('click',()=>iosHint.classList.remove('visible'));
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    if(location.protocol==='https:'||location.hostname==='localhost')
      navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('[SW]',e));
  });
}

/* ===================== INIT ===================== */
drawTraces();
drawComponents();
updateBoard();
</script>
